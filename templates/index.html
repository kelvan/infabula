<!DOCTYPE html>
<html lang="de" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>infabula 🍼</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍼</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body class="log-active">

<header>
  <img class="logo-svg" src="/static/logo.svg" alt="infabula">
  <button class="lang-btn" id="lang-btn" onclick="switchLang()">EN</button>
</header>

<div class="day-nav">
  <button id="btn-prev" onclick="changeDay(-1)">←</button>
  <div class="day-label" id="day-label" onclick="openDatePicker()"></div>
  <button id="btn-next" onclick="changeDay(1)">→</button>
  <input type="date" id="date-picker" class="date-picker-hidden" onchange="jumpToDate(this.value)">
</div>


<div class="main">
  <div class="tab-page active" id="tab-log">
    <div id="birthday-banner-wrap"></div>
    <div id="sleep-banner-wrap"></div>
    <div id="walk-banner-wrap"></div>
    <div class="view-toggle" id="log-view-toggle">
      <button class="range-pill active" data-view="list" onclick="setLogView('list')">List</button>
      <button class="range-pill" data-view="timeline" onclick="setLogView('timeline')">Timeline</button>
      <div class="tl-legend-slot" id="tl-legend-slot"></div>
    </div>
    <div id="log-list-view">
      <div id="ip-legend" class="ip-legend"></div>
      <div id="diaper-count" class="diaper-count"></div>
      <div class="day-entries" id="entry-list"></div>
    </div>
    <div id="timeline-view" style="display:none;"></div>
  </div>

  <div class="tab-page" id="tab-stats">
    <div class="stats-wrap" id="stats-content"></div>
    <div class="stats-wrap">
      <div class="section-title" id="export-title">Export</div>
      <div class="range-pills" id="range-pills">
        <button class="range-pill active" data-range="today" onclick="selectRange('today')">Today</button>
        <button class="range-pill" data-range="week" onclick="selectRange('week')">This week</button>
        <button class="range-pill" data-range="month" onclick="selectRange('month')">This month</button>
        <button class="range-pill" data-range="custom" onclick="selectRange('custom')">Custom</button>
      </div>
      <div class="custom-range" id="custom-range">
        <input type="date" id="export-start">
        <span>–</span>
        <input type="date" id="export-end">
      </div>
      <div class="export-actions">
        <button class="btn-small" id="export-report-btn" onclick="openReport()">Open report</button>
        <button class="btn-small secondary" id="export-csv-btn" onclick="downloadCsv()">Download CSV</button>
      </div>
    </div>
  </div>

  <div class="tab-page" id="tab-settings">
    <div class="settings-wrap" id="settings-content"></div>
  </div>
</div>

<script>
(function() {
  var h = location.hash.slice(1);
  if (h === 'stats' || h === 'settings') {
    document.getElementById('tab-log').classList.remove('active');
    document.getElementById('tab-btn-log').classList.remove('active');
    document.getElementById('tab-' + h).classList.add('active');
    document.getElementById('tab-btn-' + h).classList.add('active');
    document.body.classList.remove('log-active');
  }
  var v = localStorage.getItem('logView');
  if (v === 'timeline') {
    document.querySelectorAll('#log-view-toggle .range-pill').forEach(function(b) {
      b.classList.toggle('active', b.dataset.view === v);
    });
    document.getElementById('log-list-view').style.display = 'none';
    document.getElementById('timeline-view').style.display = '';
  }
})();
</script>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-btn-log" onclick="switchTab('log', this)">
    <svg viewBox="0 0 24 24" class="tab-ic"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
    <span class="tab-lbl">Verlauf</span>
  </button>
  <button class="tab-btn" id="tab-btn-stats" onclick="switchTab('stats', this)">
    <svg viewBox="0 0 24 24" class="tab-ic"><path d="M5 19V10M12 19V5M19 19v-6"/></svg>
    <span class="tab-lbl">Auswertung</span>
  </button>
  <button class="tab-btn" id="tab-btn-settings" onclick="switchTab('settings', this)">
    <svg viewBox="0 0 24 24" class="tab-ic"><circle cx="12" cy="12" r="2.6"/><path d="M12 4.5v2M12 17.5v2M19.5 12h-2M6.5 12h-2M17.4 6.6l-1.4 1.4M8 16l-1.4 1.4M17.4 17.4L16 16M8 8 6.6 6.6"/></svg>
    <span class="tab-lbl">Einstellungen</span>
  </button>
</div>

<div class="quick-actions" id="quick-actions-wrap"></div>

<button class="fab" id="fab" onclick="openModal()" title="Neuer Eintrag">
  <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Neuer Eintrag</h2>
      <button class="close-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="type-grid" id="type-grid">
      <div class="type-tile" id="tile-diaper" onclick="selectType('diaper')"><div class="t-icon"><svg viewBox="0 0 24 24" class="ic"><path d="M4.5 8h15c.3 0 .5.2.5.5C20 13.7 16.4 18 12 18S4 13.7 4 8.5c0-.3.2-.5.5-.5Z"/><path d="M6.2 8.8c1.7 1 3.8 1.5 5.8 1.5s4.1-.5 5.8-1.5"/><path d="M3 9.3h1.7M19.3 9.3H21"/></svg></div><div class="t-label">Windel</div></div>
      <div class="type-tile" id="tile-nursing" onclick="selectType('nursing')"><div class="t-icon"><svg viewBox="0 0 24 24" class="ic"><path d="M12 20.5S4.5 15.8 4.5 10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.8c0 5.6-7.5 10.3-7.5 10.3Z"/></svg></div><div class="t-label">Stillen</div></div>
      <div class="type-tile" id="tile-bottle" onclick="selectType('bottle')"><div class="t-icon"><svg viewBox="0 0 24 24" class="ic"><rect x="7" y="8.5" width="10" height="11.5" rx="3"/><path d="M9.3 8.5V6.6a1 1 0 0 1 1-1h3.4a1 1 0 0 1 1 1v1.9"/><path d="M10.3 5.6c0-1.5.8-2.6 1.7-2.6s1.7 1.1 1.7 2.6"/><path d="M9 12.3h1.6M9 15.3h1.6M9 18.3h1.6"/></svg></div><div class="t-label">Fläschchen</div></div>
      <div class="type-tile" id="tile-sleep_start" onclick="selectType('sleep_start')"><div class="t-icon"><svg viewBox="0 0 24 24" class="ic"><path d="M3 15h6l-6 6h6"/><path d="M10 9h5l-5 5h5"/><path d="M16 4h4l-4 4h4"/></svg></div><div class="t-label">Eingeschlafen</div></div>
      <div class="type-tile" id="tile-note" onclick="selectType('note')"><div class="t-icon"><svg viewBox="0 0 24 24" class="ic"><path d="M6 3.5h9L19.5 8v12.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M8.5 12h7M8.5 15.5h7M8.5 8.5h3"/></svg></div><div class="t-label">Notiz</div></div>
      <div class="type-tile" id="tile-walk" onclick="selectType('walk')"><div class="t-icon"><svg viewBox="0 0 24 24" class="ic"><ellipse cx="15" cy="16" rx="2.6" ry="3.6" transform="rotate(12 15 16)"/><circle cx="12.6" cy="12.4" r=".9"/><circle cx="14" cy="11.3" r=".95"/><circle cx="15.6" cy="11.1" r=".95"/><circle cx="17" cy="11.8" r=".85"/><ellipse cx="8" cy="7.5" rx="2" ry="2.8" transform="rotate(-12 8 7.5)"/><circle cx="6" cy="4.6" r=".7"/><circle cx="7.3" cy="3.8" r=".75"/><circle cx="8.7" cy="3.9" r=".7"/></svg></div><div class="t-label">Spaziergang</div></div>
      <div class="type-tile" id="tile-clothing" onclick="selectType('clothing')"><div class="t-icon"><svg viewBox="0 0 24 24" class="ic"><path d="M8.5 4 5.8 5.7a1.4 1.4 0 0 0-.5 1.8L6.6 10l1.9-.9v9.4a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1V9.1l1.9.9 1.3-2.5a1.4 1.4 0 0 0-.5-1.8L15.5 4a4 4 0 0 1-7 0Z"/></svg></div><div class="t-label">Kleidung</div></div>
      <div class="type-tile" id="tile-mood" onclick="selectType('mood')"><div class="t-icon"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="8.3"/><circle cx="9.2" cy="10.3" r=".9"/><circle cx="14.8" cy="10.3" r=".9"/><path d="M8.3 14.5c1 1.6 2.3 2.5 3.7 2.5s2.7-.9 3.7-2.5"/></svg></div><div class="t-label">Stimmung</div></div>
    </div>

    <div class="form-fields" id="form-fields"></div>
  </div>
</div>

<div class="modal-overlay quick-overlay" id="quick-overlay" onclick="quickOverlayClick(event)">
  <div class="modal quick-modal">
    <div class="modal-header">
      <h2 id="quick-title"></h2>
      <button class="close-btn" onclick="closeQuickPopup()"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="quick-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
