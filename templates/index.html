<!DOCTYPE html>
<html lang="de" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>infabula 🍼</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍼</text></svg>">
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>

<header>
  <img class="logo-svg" src="/static/logo.svg" alt="infabula">
  <button class="lang-btn" id="lang-btn" onclick="switchLang()">EN</button>
</header>

<div class="day-nav">
  <button id="btn-prev" onclick="changeDay(-1)">←</button>
  <div class="day-label" id="day-label" onclick="openDatePicker()"></div>
  <button id="btn-next" onclick="changeDay(1)">→</button>
  <input type="date" id="date-picker" class="date-picker-hidden" onchange="jumpToDate(this.value)">
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-btn-log" onclick="switchTab('log', this)">📋 Verlauf</button>
  <button class="tab-btn" id="tab-btn-stats" onclick="switchTab('stats', this)">📊 Auswertung</button>
</div>

<div class="main">
  <div class="tab-page active" id="tab-log">
    <div id="sleep-banner-wrap"></div>
    <div id="walk-banner-wrap"></div>
    <div id="ip-legend" class="ip-legend"></div>
    <div class="day-entries" id="entry-list"></div>
  </div>

  <div class="tab-page" id="tab-stats">
    <div class="stats-wrap" id="stats-content"></div>
  </div>
</div>

<button class="fab" id="fab" onclick="openModal()" title="Neuer Eintrag">＋</button>

<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Neuer Eintrag</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>

    <div class="type-grid" id="type-grid">
      <div class="type-tile" id="tile-diaper" onclick="selectType('diaper')"><div class="t-icon">🧷</div><div class="t-label">Windel</div></div>
      <div class="type-tile" id="tile-nursing" onclick="selectType('nursing')"><div class="t-icon">🤱</div><div class="t-label">Stillen</div></div>
      <div class="type-tile" id="tile-bottle" onclick="selectType('bottle')"><div class="t-icon">🍼</div><div class="t-label">Fläschchen</div></div>
      <div class="type-tile" id="tile-sleep_start" onclick="selectType('sleep_start')"><div class="t-icon">😴</div><div class="t-label">Eingeschlafen</div></div>
      <div class="type-tile" id="tile-weight" onclick="selectType('weight')"><div class="t-icon">⚖️</div><div class="t-label">Gewicht</div></div>
      <div class="type-tile" id="tile-note" onclick="selectType('note')"><div class="t-icon">📝</div><div class="t-label">Notiz</div></div>
      <div class="type-tile" id="tile-walk" onclick="selectType('walk')"><div class="t-icon">🚶</div><div class="t-label">Spaziergang</div></div>
      <div class="type-tile" id="tile-clothing" onclick="selectType('clothing')"><div class="t-icon">👕</div><div class="t-label">Kleidung</div></div>
    </div>

    <div class="form-fields" id="form-fields"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
