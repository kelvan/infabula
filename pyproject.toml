[project]
name = "infabula"
version = "0.1.0"
description = "Simple baby journal as a local web application"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite",
    "bcrypt>=5.0.0",
    "pyotp>=2.10.0",
    "webauthn>=3.0.0",
    "qrcode>=8.2",
]

[project.optional-dependencies]
postgres = [
    "asyncpg",
]
mysql = [
    "aiomysql",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
