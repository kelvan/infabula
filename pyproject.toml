[project]
name = "infabula"
version = "0.1.0"
description = "Self-hosted, multi-user baby journal PWA for the household"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite",
    "bcrypt>=5.0.0",
    "pyotp>=2.10.0",
    "webauthn>=3.0.0",
    "qrcode>=8.2",
    "pillow>=11.0",
    "pywebpush>=2.5.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg",
]
mysql = [
    "aiomysql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
